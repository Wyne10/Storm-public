### Format

format-effect-active: "%dtf_duration_{effect_<key>_remaining}_HH:mm:ss%"
format-effect-inactive: "- - -"

### Messages

## Info

## Error
error-effect-not-found: "<red>▶ <white>Effect '<key>' doesn't exist!"
error-player-not-found: "<red>▶ <white>Player '<name>' doesn't exist!"
error-currency-not-found: "<red>▶ <white>Currency '<currency>' doesn't exist!"
error-insufficient-funds: "<red>▶ <white>Not enough funds!"
error-effect-already-active: "<red>▶ <white>That effect is already active!"

## Success
success-plugin-reload: "<green>▶ <white>Plugin reloaded!"
success-effect-apply: "<green>▶ <white>Effect '%effect_<key>_name%<reset><white>' applied."
success-effect-clear: "<green>▶ <white>Effect '%effect_<key>_name%<reset><white>' cleared."
success-effect-purchase: "<green>▶ <white>You bought the effect '%effect_<key>_name%<reset><white>'."
success-effects-purchase: "<green>▶ <white>Effects applied."
success-effects-clear: "<green>▶ <white>Effects cleared."
