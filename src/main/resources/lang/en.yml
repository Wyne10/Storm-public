### Format

format-effect-active: "%dtf_duration_{effect_<key>_remaining}_HH:mm:ss%"
format-effect-inactive: "- - -"

### Messages

## Info

## Error
error-effect-not-found: "<red>Effect '<key>' doesn't exist!"
error-player-not-found: "<red>Player '<name>' doesn't exist!"
error-currency-not-found: "<red>Currency '<currency>' doesn't exist!"
error-insufficient-funds: "<red>Not enough funds!"
error-effect-already-active: "<red>That effect is already active!"

## Success
success-plugin-reload: "<green>Plugin reloaded!"
success-effect-apply: "<green>Effect '%effect_<key>_name%<reset><green>' applied."
success-effect-clear: "<green>Effect '%effect_<key>_name%<reset><green>' cleared."
success-effect-purchase: "<green>You bought the effect '%effect_<key>_name%<reset><green>'."
success-effects-purchase: "<green>Effects applied."
success-effects-clear: "<green>Effects cleared."
